<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ค้นหาสาขาที่ใช่ | Find Your Program – International College, Burapha University</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1b2a41;--mute:#5d6b80;--line:#d9dee6;--accent:#0f6e73;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10171f;--card:#18222d;--ink:#eaeef3;--mute:#9fb0c3;--line:#2c3947;--accent:#4fc1c6;--accent-ink:#0b1a1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai","Leelawadee UI","Segoe UI","Tahoma",sans-serif;font-size:18px;line-height:1.6}
main{max-width:680px;margin:0 auto;padding:18px 18px 60px}
h1{font-size:1.7rem;line-height:1.3;margin:0 0 10px}
h2{font-size:1.35rem;line-height:1.4;margin:0 0 18px}
p{margin:0 0 14px}
.mute{color:var(--mute);font-size:.95rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.logo{height:54px;width:auto;max-width:calc(100% - 110px);background:#fff;border-radius:10px;padding:6px 12px;border:1px solid var(--line)}
.lang{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{background:var(--card);border:0;padding:5px 12px;font-size:.9rem}
.lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:12px 26px;font-weight:700}
.ghost{background:none;border:0;color:var(--mute);padding:8px 0;text-decoration:underline}
.bar{height:6px;background:var(--line);border-radius:3px;margin:0 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 10px}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.hero{border-left:8px solid var(--c);padding-left:18px;margin-bottom:18px}
.hero .en{color:var(--mute);font-size:.95rem;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0;margin:0 0 16px;list-style:none}
.chips li{border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-size:.92rem}
.rank{margin:22px 0 6px}
.rk{display:grid;grid-template-columns:1fr 52px;gap:4px 10px;align-items:center;margin-bottom:10px;font-size:.95rem}
.rk .b{grid-column:1/2;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.rk .b i{display:block;height:100%;background:var(--c)}
.rk span:last-child{text-align:right;color:var(--mute)}
.contact{display:flex;gap:18px;align-items:center;border-top:1px solid var(--line);margin-top:22px;padding-top:20px}
.contact img{width:150px;height:150px;flex:none;border-radius:8px;background:#fff;border:1px solid var(--line)}
.linkbtn{display:inline-block;border:1.5px solid var(--accent);color:var(--accent);font-weight:700;text-decoration:none;border-radius:10px;padding:8px 18px;margin:4px 0 6px}
.linkbtn:hover{background:var(--accent);color:var(--accent-ink)}
.sep{border:0;border-top:1px solid var(--line);margin:22px 0}
.no{display:inline-block;min-width:1.7em;height:1.7em;line-height:1.7em;text-align:center;border-radius:50%;background:var(--c);color:#fff;font-size:.8rem;margin-right:8px}
.contact a{color:var(--accent);font-weight:700;word-break:break-all;display:inline-block;margin-top:2px}
.contact h3{font-size:1.1rem;margin:0 0 6px}
@media (max-width:480px){.contact{flex-direction:column;text-align:center}}
footer{margin-top:22px}
</style>
</head>

const app = document.getElementById("app");
let L = 1, view = "start", i = 0, ans = [], qs = [], fresh = false, topColor = "#0f6e73";
const shuf = a => { a = a.slice(); for (let n=a.length-1;n>0;n--){ const m=Math.floor(Math.random()*(n+1)); [a[n],a[m]]=[a[m],a[n]]; } return a; };       // L: 0 = TH, 1 = EN
const t = x => (typeof x === "function" ? x : x)[L];
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function header(){
  return `<div class="top"><img class="logo" src="${LOGO}" alt="${T.inst[0]} / ${T.inst[1]}">
  <div class="lang" role="group" aria-label="Language / ภาษา">
   <button data-l="0" aria-pressed="${L==0}" lang="th">ไทย</button>
   <button data-l="1" aria-pressed="${L==1}" lang="en">EN</button></div></div>`;
}
function render(){
  document.documentElement.lang = L ? "en" : "th";
  app.innerHTML = header() + ({start:startH, quiz:quizH, result:resultH}[view])();
  app.querySelectorAll(".lang button").forEach(b => b.onclick = () => { L = +b.dataset.l; render(); });
  if (view==="start") document.getElementById("go").onclick = () => { qs = shuf(Q).map(q => ({q:q.q, o:shuf(q.o)})); view="quiz"; i=0; ans=[]; render(); };
  if (view==="quiz"){
    app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      ans[i] = +b.dataset.k;
      if (i < qs.length-1) i++; else { view = "result"; fresh = true; }
      render(); if (view==="result") window.scrollTo(0,0);
    });
    const back = document.getElementById("back"); if (back) back.onclick = () => { i--; render(); };
  }
  if (view==="result"){ document.getElementById("again").onclick = () => { view="start"; render(); }; if (fresh){ fresh=false; confetti(); } }
}
function startH(){ return `<div class="card"><h1>${T.title[L]}</h1><p>${T.intro[L]}</p><p class="mute">${T.note[L]}</p>
  <button class="primary" id="go">${T.go[L]}</button></div>`; }
function quizH(){
  const q = qs[i];
  return `<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${Q.length}" aria-valuenow="${i+1}"><i style="width:${(i+1)/Q.length*100}%"></i></div>
  <p class="mute">${T.qn(i+1,Q.length)[L]}</p>
  <div class="card"><h2 id="q">${esc(q.q[L])}</h2>
  <div role="group" aria-labelledby="q">${q.o.map((o,k)=>`<button class="opt${ans[i]===k?" sel":""}" data-k="${k}">${esc(o[0][L])}</button>`).join("")}</div>
  <div class="row"><button class="ghost" id="back" ${i?"":"hidden"}>${T.back[L]}</button></div></div>`;
}
// Score = share of each program's maximum possible score (so programs with fewer/lighter options are not disadvantaged).
// If the 2nd program is within 5% of the 1st, both are shown as top matches (never more than 2).
function evaluate(){
  const raw = Object.fromEntries(Object.keys(P).map(k => [k,0])), mx = {...raw};
  ans.forEach((k,n) => Object.entries(qs[n].o[k][1]).forEach(([p,v]) => raw[p]+=v));
  Q.forEach(q => Object.keys(mx).forEach(p => mx[p] += Math.max(...q.o.map(o => o[1][p]||0))));
  const n = Object.fromEntries(Object.keys(P).map(p => [p, raw[p]/mx[p]]));
  const order = Object.keys(P).sort((a,b) => n[b]-n[a] || raw[b]-raw[a]);
  const tops = [order[0]];
  if (n[order[1]] >= n[order[0]]*0.95) tops.push(order[1]);
  const rank = {}; order.forEach((p,i) => rank[p] = tops.includes(p) ? 1 : i+1);
  return {order, n, tops, rank};
}
function resultH(){
  const {order, n, tops, rank} = evaluate(), top = n[order[0]] || 1;
  topColor = P[tops[0]].c;
  const name = x => L ? x.en : x.th, alt = x => L ? x.th : x.en;
  const block = k => { const p = P[k]; return `<div style="--c:${p.c}">
   <div class="hero"><h1>${name(p)}</h1><p class="en">${alt(p)}</p></div>
   <p>${p.d[L]}</p>
   <p class="mute">${T.jobs[L]}</p>
   <ul class="chips">${p.j[L].map(x=>`<li>${x}</li>`).join("")}</ul>
   <a class="linkbtn" href="${p.u}" target="_blank" rel="noopener">${T.learn[L]} ↗</a></div>`; };
  return `<div class="card">
   <p class="mute">${tops.length>1 ? T.bestTwo[L] : T.best[L]}</p>
   ${tops.map(block).join('<hr class="sep">')}
   <h2 class="rank">${T.rank[L]}</h2>
   <p class="mute">${T.rankSub[L]}</p>
   ${order.map(k => `<div class="rk" style="--c:${P[k].c}"><span><b class="no">${rank[k]}</b>${name(P[k])}</span><span>${Math.round(n[k]/top*100)}%</span><div class="b"><i style="width:${n[k]/top*100}%"></i></div></div>`).join("")}
   <div class="contact"><img src="${QR}" alt="QR Code Linktree">
    <div><h3>${T.contact[L]}</h3><p class="mute" style="margin:0 0 8px">${T.scan[L]}</p><a href="https://linktr.ee/buuic" target="_blank" rel="noopener">linktr.ee/buuic</a></div></div>
   <footer><p class="mute">${T.disc[L]}</p><button class="primary" id="again">${T.again[L]}</button></footer></div>`;
}
function confetti(){
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;   // calmer version, still shown
  const cv = document.createElement("canvas"); cv.setAttribute("aria-hidden","true");
  cv.style.cssText = "position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99";
  document.body.appendChild(cv);
  const d = devicePixelRatio||1, W = cv.width = innerWidth*d, H = cv.height = innerHeight*d, g = cv.getContext("2d");
  const cols = [topColor,"#f5b700","#e4572e","#17a398","#7b5ea7","#3a86ff"], R = Math.random, ps = [];
  const mk = (x,y,vx,vy,gr,dr) => ps.push({x,y,vx,vy,gr,dr,w:(12+R()*10)*d,r:R()*6.3,vr:(R()-.5)*.35,tl:R()*6.3,c:cols[Math.floor(R()*cols.length)]});
  if (!calm) for (let n=0;n<70;n++){ const sd = n%2?-1:1; mk(sd>0?0:W, H*.9, sd*(4+R()*12)*d, -(16+R()*16)*d, .5*d, .985); }   // bursts from the bottom corners
  for (let n=0;n<(calm?60:85);n++) mk(R()*W, -R()*H*.9, (R()-.5)*1.5*d, (1+R())*d, .1*d, .96);   // slow, floaty rain                          // paper rain from the top
  const t0 = performance.now();
  (function f(now){
    const t = now - t0; g.clearRect(0,0,W,H);
    ps.forEach(p => {
      p.vy += p.gr; p.vx *= p.dr; p.vy *= p.dr; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.tl += .2;
      g.save(); g.globalAlpha = Math.max(0, Math.min(1, (8200 - t)/1500));
      g.translate(p.x,p.y); g.rotate(p.r); g.scale(1, Math.cos(p.tl)); g.fillStyle = p.c;
      g.fillRect(-p.w/2, -p.w/4, p.w, p.w/2); g.restore();
    });
    if (t < 8200) requestAnimationFrame(f); else cv.remove();
  })(t0);
}
render();
